[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "openswx-gears"
version = "0.1.0"
description = "Example openswx plugin: a spur gear command in the plugins toolset"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["openswx>=0.4"]

# openswx imports this module at start-up; the commands it registers become REST commands and MCP tools.
[project.entry-points."openswx.plugins"]
gears = "openswx_gears"

[tool.setuptools]
packages = ["openswx_gears"]
