# Linux build (a tarball of the PyInstaller folder). Run by hand from the Actions tab: it has not been run yet,
# and it is kept out of the release workflow (build.yml) until it has been seen to work.
name: build-linux

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04   # (an older glibc: the result also runs on newer distributions)
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libglu1-mesa libegl1 xvfb
      - name: Test
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest -q
      - name: Build
        run: bash packaging/build_linux.sh
      - name: The packed build opens a file and exports it
        run: |
          mkdir check && tar -C check -xzf dist-new/openswx-*-linux-*.tar.gz
          check/openswx/openswx-cli convert tests/data/native/v1_bracket.oswprt check/bracket.step
          test -s check/bracket.step
          check/openswx/openswx-cli massprops tests/data/native/v1_bracket.oswprt
      - uses: actions/upload-artifact@v4
        with:
          name: openswx-linux
          path: dist-new/*.tar.gz
          if-no-files-found: error
