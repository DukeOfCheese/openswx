# Build the Python package (sdist + wheel) and publish it to PyPI with trusted publishing (no stored token).
#
# Runs on a version tag (v*), next to build.yml, which builds the desktop installers. Until PyPI is set up the
# publish job is skipped; to switch it on:
#   1. On pypi.org: Account → Publishing → Add a new pending publisher: project "openswx", owner "DukeOfCheese",
#      repository "openswx", workflow "publish.yml", environment "pypi".
#   2. On GitHub: Settings → Environments → New environment "pypi"; Settings → Secrets and variables → Actions →
#      Variables → New variable PYPI_PUBLISH = true.
# The build job always runs (also by hand from the Actions tab), so a broken package shows up before a release.
name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Build
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - name: The tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} but pyproject.toml says $v"; exit 1; }
      - name: The wheel installs and runs
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglu1-mesa libegl1
          python -m venv /tmp/v && /tmp/v/bin/pip install dist/*.whl
          cd /tmp && /tmp/v/bin/python -c "import openswx, openswx.session as S; print(openswx.__version__, len(S.COMMANDS), 'commands')"
          /tmp/v/bin/openswx --help > /dev/null
      - uses: actions/upload-artifact@v7
        with:
          name: python-package
          path: dist/

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/openswx/
    permissions:
      id-token: write  # trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-package
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
