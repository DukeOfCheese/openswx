# Release builds: the Windows installer (.exe) and portable zip, and the macOS app (.pkg installer and zipped
# openswx.app) for Apple silicon and Intel. Each runner builds for its own platform (PyInstaller does not
# cross-compile) with packaging/build.py. Run by hand (Actions > build > Run workflow) or by pushing a v* tag,
# which also attaches everything to a GitHub release.
name: build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: macos-15
            name: macos-arm64
          - os: macos-15-intel
            name: macos-x86_64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install -e ".[desktop,dev]"
      - name: Test
        run: python -m pytest -q
      - name: Inno Setup
        if: runner.os == 'Windows'
        run: |
          if [ ! -f "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" ]; then choco install innosetup -y --no-progress; fi
      - name: Build
        run: python packaging/build.py --zip
      - name: Check the macOS app and installer
        if: runner.os == 'macOS'
        run: |
          plutil -lint dist/openswx.app/Contents/Info.plist
          codesign --verify --deep --strict dist/openswx.app
          sudo installer -pkg dist/openswx-*.pkg -target /
          test -x /Applications/openswx.app/Contents/MacOS/openswx
          /usr/local/bin/openswx-cli --help
      - name: Smoke test (a tetrahedral study in the built app)
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then python packaging/smoke_study.py /Applications/openswx.app/Contents/MacOS/openswx-cli
          else python packaging/smoke_study.py dist/openswx/openswx-cli.exe; fi
      - uses: actions/upload-artifact@v7
        with:
          name: openswx-${{ matrix.name }}
          path: |
            dist/*.exe
            dist/*.pkg
            dist/*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Release notes (the CHANGELOG section for this version)
        run: python3 tools/release_notes.py "${GITHUB_REF_NAME}" > release-notes.md
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          body_path: release-notes.md
