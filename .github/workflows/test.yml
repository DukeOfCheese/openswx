# The test suite on every push and pull request (the release builds are in build.yml).
name: test

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"   # the oldest supported version (pyproject.toml requires-python)
          - os: ubuntu-latest
            python: "3.13"
          - os: windows-latest
            python: "3.13"
          - os: macos-15
            python: "3.13"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: System libraries (OpenCASCADE needs OpenGL)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglu1-mesa libegl1
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Errors only (syntax, undefined names)
        run: |
          python -m pip install ruff
          ruff check --select E9,F63,F7,F82 openswx tests tools packaging
      - name: Test
        run: python -m pytest -q --durations=20

  ui:
    # the real page in a headless browser against a real server (tests/ui; skipped where Playwright is absent)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: System libraries (OpenCASCADE needs OpenGL)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglu1-mesa libegl1
      - name: Install
        run: |
          python -m pip install -e ".[dev]" playwright
          python -m playwright install --with-deps chromium
      - name: UI tests
        run: python -m pytest tests/ui -q -rs
