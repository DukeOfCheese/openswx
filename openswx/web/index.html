<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>openswx</title>
<link rel="stylesheet" href="/static/css/style.css">
<script type="importmap">{"imports": {"three": "/static/vendor/three.module.min.js", "three-mesh-bvh": "/static/vendor/three-mesh-bvh.module.js"}}</script>
</head>
<body>
<!-- icon-sprite -->
<div id="app">
  <header id="titlebar">
    <button id="brand" title="Home (Ctrl+Shift+H)" aria-label="Home">
      <span class="brand-cube"></span><span class="brand-name">open<b>swx</b></span>
    </button>
    <nav id="menubar"></nav>
    <div id="quickaccess"></div>
    <div id="doctitle">Part1</div>
    <div id="search"><input type="search" placeholder="Search commands" id="cmdsearch"><div id="searchresults"></div></div>
  </header>

  <section id="commandmanager">
    <div id="cm-buttons"></div>
    <div id="cm-tabs"></div>
  </section>

  <main id="workspace">
    <aside id="leftpane">
      <div id="lp-tabs">
        <button class="lp-tab active" data-pane="tree" title="FeatureManager Design Tree" aria-label="FeatureManager Design Tree" aria-pressed="true"></button>
        <button class="lp-tab" data-pane="pm" title="PropertyManager" aria-label="PropertyManager" aria-pressed="false"></button>
        <button class="lp-tab" data-pane="config" title="ConfigurationManager" aria-label="ConfigurationManager" aria-pressed="false"></button>
        <button class="lp-tab" data-pane="display" title="DisplayManager" aria-label="DisplayManager" aria-pressed="false"></button>
      </div>
      <div id="lp-filter"><input type="text" placeholder="&#x1F50D;  Filter" id="treefilter"></div>
      <div id="tree" class="lp-pane"></div>
      <div id="pm" class="lp-pane hidden"></div>
      <div id="config" class="lp-pane hidden"><div class="cfg-item">&#9632; Default [ Part1 ]</div></div>
      <div id="display" class="lp-pane hidden"></div>
      <div id="lp-resize"></div>
    </aside>

    <section id="graphics">
      <canvas id="view"></canvas>
      <div id="overlay"></div>
      <div id="headsup"></div>
      <div id="confirm"></div>
      <div id="docname-corner"></div>
      <div id="prompt-msg"></div>
      <div id="minitb" class="hidden"></div>
      <div id="orient-menu" class="hidden"></div>
      <canvas id="triad" width="110" height="110"></canvas>
    </section>

    <aside id="taskpane" class="collapsed">
      <div id="tp-tabs">
        <button class="tp-tab hidden" data-pane="people" title="People in this part" aria-label="People in this part"></button>
        <button class="tp-tab" data-pane="agent" title="Agent activity (MCP)" aria-label="Agent activity (MCP)"></button>
        <button class="tp-tab" data-pane="props" title="Mass Properties" aria-label="Mass Properties"></button>
        <button class="tp-tab" data-pane="help" title="Shortcuts" aria-label="Shortcuts"></button>
      </div>
      <div id="tp-body">
        <div id="tp-people" class="tp-pane hidden"></div>
        <div id="tp-agent" class="tp-pane"></div>
        <div id="tp-props" class="tp-pane hidden"></div>
        <div id="tp-help" class="tp-pane hidden"></div>
      </div>
    </aside>
  </main>

  <footer id="statusbar">
    <span id="sb-app">openswx</span>
    <span class="sb-fill"></span>
    <span id="sb-coords"></span>
    <span id="sb-state"></span>
    <span id="sb-editing">Editing Part</span>
    <span id="sb-units">MMGS</span>
    <span id="sb-agent" title="MCP endpoint"></span>
  </footer>
</div>

<!-- Home page (home.js): over the editor until you pick something -->
<div id="home" class="hidden"></div>
<div id="ctxmenu" class="hidden"></div>
<div id="modal" class="hidden"><div id="modal-box"></div></div>
<div id="toasts"></div>
<input type="file" id="fileinput" class="hidden" accept=".oswprt,.oswasm,.oswdrw,.step,.stp,.igs,.iges,.brep,.x_t,.x_b,.stl,.3mf,.FCStd,.sldprt,.sldasm,.slddrw">
<script type="module" src="/static/js/app.js"></script>
</body>
</html>
