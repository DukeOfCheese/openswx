[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openswx"
version = "0.1.0"
description = "Open-source parametric CAD with a SOLIDWORKS-style workflow and a built-in MCP server for agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "build123d>=0.13",
  "numpy",
  "scipy",
  "fastapi",
  "uvicorn[standard]",
  "mcp>=2.3",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]
difftest = ["pywin32; platform_system == 'Windows'"]  # tools/difftest only (development oracle); openswx itself never uses SOLIDWORKS

[project.scripts]
openswx = "openswx.__main__:main"

[tool.setuptools]
packages = ["openswx"]

[tool.setuptools.package-data]
openswx = ["web/*", "web/vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
