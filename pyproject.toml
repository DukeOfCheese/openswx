[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "openswx"
version = "0.4.1"
description = "Open-source parametric CAD with a familiar layout and a built-in MCP server for AI agents"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["cad", "parametric", "solidworks", "mcp", "opencascade", "step", "parasolid"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Manufacturing",
  "Intended Audience :: Science/Research",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Multimedia :: Graphics :: 3D Modeling",
  "Topic :: Scientific/Engineering",
]
authors = [{ name = "The openswx authors" }]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
  "build123d>=0.13",
  "numpy",
  "scipy",
  "fastapi",
  "uvicorn[standard]",
  "mcp>=2.3",
  "ezdxf",  # DXF import / export (imported directly; build123d depends on it too)
  # (cryptography, through mcp -> pyjwt: from 49 on it has macOS wheels for Apple silicon only; built from source
  # on an Intel Mac it links Homebrew's OpenSSL, which clashes with Python's in the desktop app)
  "cryptography<49; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-xdist", "httpx", "netgen-mesher>=6.2", "ruff"]
mesh = ["netgen-mesher>=6.2"]  # curvature-based tetrahedral meshes for simulation (LGPL-2.1; fea_tet.py)
desktop = ["pywebview>=6", "pyinstaller>=6"]  # the native window and the release build (packaging/build.py)
difftest = ["pywin32; platform_system == 'Windows'"]  # tools/difftest only (development oracle); openswx itself never uses SOLIDWORKS
collab = ["openswx-collab-protocol>=0.1.0,<0.2", "websockets>=13", "httpx>=0.27"]  # live collaboration through an openswx-collab server (openswx/collab)

[project.urls]
Homepage = "https://github.com/DukeOfCheese/openswx"
Documentation = "https://github.com/DukeOfCheese/openswx/blob/main/docs/commands.md"
Issues = "https://github.com/DukeOfCheese/openswx/issues"
Changelog = "https://github.com/DukeOfCheese/openswx/blob/main/CHANGELOG.md"
Source = "https://github.com/DukeOfCheese/openswx"

[project.scripts]
openswx = "openswx.__main__:main"

[tool.setuptools]
packages = ["openswx", "openswx.collab"]

[tool.setuptools.package-data]
openswx = ["web/*", "web/vendor/*"]

[tool.ruff]
line-length = 140
# syntax and undefined names, plus unused imports/variables and redefinitions
lint.select = ["E9", "F63", "F7", "F82", "F401", "F811", "F841"]

[tool.ruff.lint.per-file-ignores]
"openswx/__init__.py" = ["F401"]
"openswx/**/__init__.py" = ["F401"]
"tests/core_helpers.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: heavy FEA and simulation runs, skip with -m 'not slow' for the fast loop",
]
