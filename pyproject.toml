[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "openswx"
version = "0.1.0"
description = "Open-source parametric CAD with a familiar layout and a built-in MCP server for AI agents"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["cad", "parametric", "solidworks", "mcp", "opencascade", "step", "parasolid"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Manufacturing",
  "Intended Audience :: Science/Research",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Multimedia :: Graphics :: 3D Modeling",
  "Topic :: Scientific/Engineering",
]
authors = [{ name = "The openswx authors" }]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
  "build123d>=0.13",
  "numpy",
  "scipy",
  "fastapi",
  "uvicorn[standard]",
  "mcp>=2.3",
  "ezdxf",  # DXF import / export (imported directly; build123d depends on it too)
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]
desktop = ["pywebview>=6", "pyinstaller>=6"]  # the native window and the release build (packaging/build.py)
difftest = ["pywin32; platform_system == 'Windows'"]  # tools/difftest only (development oracle); openswx itself never uses SOLIDWORKS

[project.urls]
Homepage = "https://github.com/DukeOfCheese/openswx"
Documentation = "https://github.com/DukeOfCheese/openswx/blob/main/docs/commands.md"
Issues = "https://github.com/DukeOfCheese/openswx/issues"
Changelog = "https://github.com/DukeOfCheese/openswx/blob/main/CHANGELOG.md"
Source = "https://github.com/DukeOfCheese/openswx"

[project.scripts]
openswx = "openswx.__main__:main"

[tool.setuptools]
packages = ["openswx"]

[tool.setuptools.package-data]
openswx = ["web/*", "web/vendor/*"]

[tool.ruff]
line-length = 140
# errors only for now (what CI checks): syntax, undefined names, misused comparisons
lint.select = ["E9", "F63", "F7", "F82"]

[tool.pytest.ini_options]
testpaths = ["tests"]
